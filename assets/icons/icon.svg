<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark slate technical container with subtle border -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" stroke-dasharray="16 8" />
  <!-- Construction / Plumb Grid marks -->
  <line x1="60" y1="256" x2="452" y2="256" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" />
  <line x1="256" y1="60" x2="256" y2="452" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" />
  <!-- Plumb Bob (Prumo) guide icon subtle top -->
  <path d="M 256,76 L 264,96 L 256,112 L 248,96 Z" fill="#f97316" opacity="0.9" />
  <line x1="256" y1="40" x2="256" y2="76" stroke="#f97316" stroke-width="3" stroke-linecap="round" />
  <!-- The GEF Letters -->
  <!-- Letter G -->
  <text x="110" y="325" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="140" fill="url(#letterGrad)" text-anchor="middle" letter-spacing="-4">G</text>
  <!-- Letter E -->
  <text x="256" y="325" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="140" fill="url(#letterGrad)" text-anchor="middle" letter-spacing="-4">E</text>
  <!-- Letter F -->
  <text x="402" y="325" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="140" fill="url(#letterGrad)" text-anchor="middle" letter-spacing="-4">F</text>
  <!-- Dynamic Graph Signal Line Uniting the 3 Letters (GEF) -->
  <!-- Passes through G base, climbs through E middle bar, surges through F peak -->
  <path d="M 64,340 L 110,310 L 180,325 L 256,260 L 330,275 L 402,200 L 452,175" 
        fill="none" stroke="url(#chartGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Graph Points / Nodes on each letter intersection -->
  <circle cx="110" cy="310" r="10" fill="#f97316" stroke="#ffffff" stroke-width="4" />
  <circle cx="256" cy="260" r="11" fill="#fb923c" stroke="#ffffff" stroke-width="4" />
  <circle cx="402" cy="200" r="12" fill="#facc15" stroke="#ffffff" stroke-width="4" />
  <circle cx="452" cy="175" r="7" fill="#facc15" />
  <!-- Trend Arrow at graph peak -->
  <polygon points="446,160 468,172 458,192" fill="#facc15" />
  <!-- Subtitle GESTOR DE FERRAGEM ERP -->
  <text x="256" y="425" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="24" fill="#f97316" text-anchor="middle" letter-spacing="4">GESTOR DE FERRAGEM</text>
  <text x="256" y="460" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="15" fill="#64748b" text-anchor="middle" letter-spacing="3">SISTEMA ERP INTEGRADO</text>
</svg>
